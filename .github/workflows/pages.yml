# Bygger spillet og lægger det på GitHub Pages.
#  - main            -> https://<bruger>.github.io/<repo>/
#  - hver anden branch -> https://<bruger>.github.io/<repo>/preview/<branch>/
name: Udgiv på GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Branch opdateret"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Byg main og alle branches
        run: bash scripts/build-pages.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
